<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Email signature: proudly supporting our staff</title>
<style>{{FONTS_ONLY}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:120px;overflow:hidden;font-family:'Montserrat',sans-serif}
.b{width:600px;height:120px;background:linear-gradient(100deg,#123D36 0%,#1A5C50 100%);display:flex;align-items:center;padding:0 22px;gap:16px;position:relative;overflow:hidden}
.b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#E8A24A}
.logo{width:100px;flex:none}
.logo svg{display:block;width:100%;height:auto}
.rule{width:1px;height:62px;background:rgba(255,255,255,.28);flex:none}
.t{flex:1}
.t b{display:block;font-size:17.5px;line-height:1.18;font-weight:800;color:#fff;letter-spacing:-.01em}
.t span{display:block;font-size:10px;line-height:1.35;font-weight:500;color:#cfe0d7;margin-top:5px}
.pill{background:#E8A24A;color:#123D36;font-weight:800;font-size:12px;padding:8px 13px;border-radius:20px;flex:none}
</style></head><body>
<div class="b">
  <div class="logo">{{LOGO_WHITE}}</div>
  <div class="rule"></div>
  <div class="t"><b>Proudly supporting our staff<br>into homeownership</b><span>A new process to homeownership on Vancouver Island</span></div>
  <div class="pill">{{URL}}</div>
</div>
</body></html>
