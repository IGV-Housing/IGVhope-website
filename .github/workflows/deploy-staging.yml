name: Deploy staging

# Every push to `staging` publishes the review site. Production is untouched:
# it deploys from `main` through the Cloudflare Git integration, to a different
# Worker.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Staging carries unreleased copy and must never be indexed - it would
      # compete with igvhope.com for the same content. Production's robots.txt
      # deliberately invites search engines and AI crawlers, so staging has to
      # override it rather than inherit it.
      #
      # These rewrites happen on the runner only. The committed files, which
      # production deploys from, are never modified - so there is no way for a
      # noindex to reach the live site through this workflow.
      - name: Block crawlers on staging
        run: |
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          # X-Robots-Tag is the authoritative signal: a robots.txt Disallow
          # alone can still leave URLs indexed if they are linked elsewhere.
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> public/_headers
          echo "--- robots.txt ---"; cat public/robots.txt
          echo "--- _headers ---";   cat public/_headers

      - name: Deploy to the staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
